<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code Agent Loop</title>
  <desc id="desc">任务经过收集上下文、模型判断、工具执行和结果验证，直到输出最终结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#819BC0"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#30383B;font-size:16px}.small{font-size:13px;fill:#596569}.node{fill:#F7F7F2;stroke:#819BC0;stroke-width:2}.action{fill:#EDF2EC;stroke:#A7BDA8;stroke-width:2}.finish{fill:#FFF5EA;stroke:#E8BE91;stroke-width:2}.edge{fill:none;stroke:#819BC0;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="470" rx="18" fill="#FFFFFF"/>
  <rect class="node" x="35" y="175" width="130" height="58" rx="10"/><text x="100" y="210" text-anchor="middle">用户提出任务</text>
  <rect class="node" x="220" y="175" width="130" height="58" rx="10"/><text x="285" y="210" text-anchor="middle">收集上下文</text>
  <polygon class="node" points="460,150 540,204 460,258 380,204"/><text x="460" y="210" text-anchor="middle">判断下一步</text>
  <rect class="action" x="600" y="70" width="120" height="58" rx="10"/><text x="660" y="105" text-anchor="middle">调用工具</text>
  <rect class="action" x="790" y="70" width="150" height="58" rx="10"/><text x="865" y="105" text-anchor="middle">Harness 执行</text>
  <rect class="node" x="790" y="280" width="150" height="58" rx="10"/><text x="865" y="315" text-anchor="middle">返回工具结果</text>
  <polygon class="node" points="660,255 735,309 660,363 585,309"/><text x="660" y="315" text-anchor="middle">验证结果</text>
  <rect class="finish" x="390" y="390" width="140" height="58" rx="10"/><text x="460" y="425" text-anchor="middle">输出最终结果</text>
  <path class="edge" d="M165 204H220"/><path class="edge" d="M350 204H380"/>
  <path class="edge" d="M520 180L600 110"/><text class="small" x="545" y="135">需要行动</text>
  <path class="edge" d="M720 99H790"/><path class="edge" d="M865 128V280"/><path class="edge" d="M790 309H735"/>
  <path class="edge" d="M585 309H285V233"/><text class="small" x="405" y="300">继续处理</text>
  <path class="edge" d="M620 348L515 398"/><text class="small" x="545" y="380">目标完成</text>
  <path class="edge" d="M460 258V390"/><text class="small" x="470" y="335">无需工具</text>
</svg>
