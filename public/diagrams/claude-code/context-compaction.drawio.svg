<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 上下文压缩流程</title>
  <desc id="desc">上下文接近限制时，较早会话被压缩成摘要，然后继续执行任务。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#819BC0"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#30383B;font-size:16px}.small{font-size:13px;fill:#596569}.node{fill:#F7F7F2;stroke:#819BC0;stroke-width:2}.action{fill:#EDF2EC;stroke:#A7BDA8;stroke-width:2}.finish{fill:#FFF5EA;stroke:#E8BE91;stroke-width:2}.edge{fill:none;stroke:#819BC0;stroke-width:2;marker-end:url(#arrow)}.hint{fill:none;stroke:#E8BE91;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1040" height="490" rx="18" fill="#FFFFFF"/>
  <rect class="node" x="30" y="170" width="150" height="58" rx="10"/><text x="105" y="205" text-anchor="middle">对话与工具执行</text>
  <rect class="node" x="225" y="170" width="150" height="58" rx="10"/><text x="300" y="205" text-anchor="middle">上下文逐渐增长</text>
  <polygon class="node" points="480,145 565,199 480,253 395,199"/><text x="480" y="194" text-anchor="middle">接近容量</text><text x="480" y="215" text-anchor="middle">限制？</text>
  <rect class="node" x="405" y="330" width="150" height="58" rx="10"/><text x="480" y="365" text-anchor="middle">继续 Agent Loop</text>
  <rect class="action" x="610" y="170" width="145" height="58" rx="10"/><text x="682" y="205" text-anchor="middle">压缩较早会话</text>
  <rect class="action" x="800" y="160" width="200" height="78" rx="10"/><text x="900" y="194" text-anchor="middle">保留目标、决策</text><text x="900" y="216" text-anchor="middle">与关键代码</text>
  <rect class="action" x="800" y="330" width="200" height="58" rx="10"/><text x="900" y="365" text-anchor="middle">摘要替代早期消息</text>
  <rect class="finish" x="610" y="330" width="145" height="58" rx="10"/><text x="682" y="354" text-anchor="middle">携带新上下文</text><text x="682" y="375" text-anchor="middle">继续执行</text>
  <rect class="finish" x="800" y="35" width="200" height="58" rx="10"/><text x="900" y="60" text-anchor="middle">CLAUDE.md 与</text><text x="900" y="81" text-anchor="middle">Compact Instructions</text>
  <path class="edge" d="M180 199H225"/><path class="edge" d="M375 199H395"/>
  <path class="edge" d="M480 253V330"/><text class="small" x="490" y="295">否</text>
  <path class="edge" d="M565 199H610"/><text class="small" x="580" y="188">是</text>
  <path class="edge" d="M755 199H800"/><path class="edge" d="M900 238V330"/><path class="edge" d="M800 359H755"/>
  <path class="edge" d="M610 359H105V228"/><text class="small" x="305" y="349">继续</text>
  <path class="hint" d="M900 93V160"/>
</svg>
